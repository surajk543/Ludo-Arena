# Local development dependencies. Not for production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ludo
      POSTGRES_PASSWORD: ludo-dev-only
      POSTGRES_DB: ludo_royale
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4
    # AOF + RDB so live rooms survive a Redis restart in development too.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata: {}
  redisdata: {}
