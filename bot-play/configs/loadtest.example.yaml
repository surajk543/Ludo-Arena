# Local load test against a development backend (BOT_LOADTEST_ENABLED=true).
# Run:
#   BOT_SERVICE_KEY=... go run ./cmd/bot-play \
#     --config configs/loadtest.example.yaml --profiles configs/profiles.yaml \
#     --i-understand-this-is-a-load-test
app:
  environment: development
  log_level: info
  log_format: text

connection:
  backend_http_url: http://localhost:8080/api/v1
  backend_ws_url: ws://localhost:8080/api/v1/ws

bots:
  enabled: true
  modes: [loadtest]
  max_concurrent_bots: 500
  max_room_joins_per_second: 50
  max_connection_attempts_per_second: 50
  lobby_wait_timeout_seconds: 60
  chat:
    in_loadtest: false           # load-test bots stay silent (set true to load the chat path too)
  shutdown:
    graceful_timeout_seconds: 120
    policy: finish_games

limits:
  max_actions_per_second_per_bot: 5

loadtest:
  enabled: true
  allowed_hosts: [localhost, 127.0.0.1]
  forbidden_hosts: [api.ludoarena.example, ludo.sungamestudio.com]
  target_connections: 200
  ramp_per_second: 20
  duration_seconds: 300
  game_mix: {ludo: 50, ludo_quick: 30, snakes_ladders: 20}
  capacity_mix: {2: 40, 3: 20, 4: 40}
  think_time_ms: {min: 100, max: 800}
  churn_per_minute: 30
  slow_reader_fraction: 0.02
  slow_reader_delay_ms: 250
  malformed_message_rate: 0.002
  report_path: loadtest-report.json

metrics:
  enabled: true
  listen_addr: 127.0.0.1:9091
