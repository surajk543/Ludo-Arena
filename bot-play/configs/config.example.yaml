# bot-play configuration reference.
#
# Every key is optional: omitted keys take the default shown here. Unknown
# keys are rejected (typos fail validation instead of being ignored).
# Validate a file with:  bot-play --config <file> --profiles configs/profiles.yaml --validate
#
# Secrets are NEVER read from this file. The bot service key comes only from
# the BOT_SERVICE_KEY environment variable and is never logged.
#
# Runtime reload: the file (and profiles.yaml) are re-read on SIGHUP and when
# their modification time changes (polled every app.reload_poll_seconds). An
# invalid file is rejected as a whole and the last valid configuration stays
# active (metric config_reload_failures_total). Keys marked [restart] cannot
# change at runtime; a reload that changes them is rejected.

app:
  name: bot-play                 # service name in logs (1..64 chars)
  environment: development       # [restart] development | preprod | production
  log_level: info                # debug | info | warn | error (applied on reload)
  log_format: json               # json | text ([restart] - format is fixed at startup)
  reload_poll_seconds: 5         # 0..3600; 0 disables mtime polling (SIGHUP still works)

connection:
  backend_http_url: http://localhost:8080/api/v1   # [restart] REST base; production requires https://
  backend_ws_url: ws://localhost:8080/api/v1/ws    # [restart] WebSocket endpoint; production requires wss://
  connect_timeout_ms: 5000       # 100..60000  WebSocket dial + wait for connection.ready
  request_timeout_ms: 5000       # 100..60000  per REST request (long-poll adds assignment_wait_seconds)
  assignment_wait_seconds: 20    # 1..25       GET /bot/assignments?wait=N long-poll (backend max 25)
  reconnect_enabled: true        # reconnect a bot whose WebSocket dropped (X-Reconnect: 1 + resync)
  reconnect_max_attempts: 8      # 0..100      consecutive failed attempts before the bot gives up
  reconnect_backoff_base_ms: 500 # 10..60000   full-jitter backoff: random(0, min(max, base*2^attempt))
  reconnect_backoff_max_ms: 30000 # 10..300000 must be >= base
  reconnect_reset_seconds: 30    # 1..3600     a connection up this long resets the attempt counter
  maintenance_backoff_seconds: 30 # 1..3600    pause after 503/4503; reconnects are spread over this window
  ping_interval_seconds: 15      # 1..60       client {"t":"ping"} interval
  pong_timeout_seconds: 10       # 1..60       no pong within this -> connection treated as dead
  outbound_queue_size: 64        # 8..4096     bounded per-connection send queue (overflow closes + reconnects)
  read_limit_bytes: 1048576      # 4096..16MiB largest inbound message accepted (after decompression)
  # permessage-deflate offer: no_context_takeover (default) | context_takeover | disabled
  compression_mode: no_context_takeover
  action_confirm_timeout_ms: 5000 # 200..60000 no authoritative event for a command -> game.request_sync
  readiness_stale_seconds: 60    # 5..3600     /readyz fails if the backend was not reached within this

bots:
  enabled: true                  # false: stop new assignments/fills, cancel load-test matchmaking,
                                 # let running games finish (or leave per shutdown.policy), no reconnects
  modes: [practice]              # practice | public_fill (combinable) | loadtest (exclusive, [restart])
                                 #   practice    serves assignment kinds "practice" and "private"
                                 #   public_fill polls lobbies, requests fills, serves "public_fill" assignments
                                 #   loadtest    dev/preprod traffic generation (see loadtest: below)
  games:                         # per-game master switch (missing key = true)
    ludo: true                   # ludo / classic
    ludo_quick: true             # ludo / quick
    snakes_ladders: true
  target_active_bots: 50         # 0..max_concurrent_bots  working population cap for practice/public_fill
                                 # (assignments are only accepted while active < target)
  max_concurrent_bots: 100       # 1..env cap (development 10000, preprod 5000, production 500): hard cap
  per_game_max: {}               # e.g. {ludo: 60, ludo_quick: 20, snakes_ladders: 40}; missing = max_concurrent_bots
  max_bots_per_room: 3           # 1..3  public fill never requests more bots than this per room
  max_room_joins_per_second: 5   # >0..1000  token bucket for seating bots (session creation / matchmaking.join)
  max_connection_attempts_per_second: 10 # >0..1000  global token bucket for WebSocket dials (reconnect-storm guard)
  lobby_wait_timeout_seconds: 90 # 5..600  a bot whose lobby has not started by then leaves
  accept_rematch: false          # true: practice/private bots accept a rematch; default declines (leaves)

  public_matchmaking:            # used only when modes includes public_fill
    enabled: false               # runtime switch for public fill
    per_game:                    # fill per game (missing key = false: opt-in)
      ludo: false
      ludo_quick: false
      snakes_ladders: false
    poll_interval_ms: 2000       # 100..60000  GET /bot/lobbies interval (jittered +-10%)
    fill_after_seconds: 15       # 0..300  only lobbies that waited at least this long
    minimum_humans: 1            # 1..3    only lobbies with at least this many humans
    maximum_wait_seconds: 27     # 1..600, > fill_after_seconds: skip lobbies about to start/time out
                                 # (backend MATCHMAKING_FILL_SECONDS defaults to 30)
    refill_cooldown_seconds: 10  # 1..600  never re-request a room within this window

  think_time:                    # global clamp applied to every profile's think_time_ms
    min_ms: 300                  # 0..15000
    max_ms: 6000                 # 0..15000, >= min_ms
    randomize: true              # false: use the midpoint of the clamped profile range
                                 # (think time is always capped at 40% of the time left to the turn deadline)

  behavior:
    default_profile: balanced    # must exist in profiles.yaml; resolved at every decision point
    random_seed: 0               # 0 = random per process; non-zero = reproducible per-bot seeds
    disconnect_simulation_enabled: false # occasionally drop the connection to mimic flaky humans
    disconnect_probability: 0.0  # 0..0.2 per own action when enabled

  identity:
    display_name_prefix: Bot     # <= 12 chars; requested name = "<prefix> <name>" (cosmetic; the BOT
                                 # badge comes from the server-side bot flag, never from the name)
    names_pool: []               # 1..16 chars each; empty = built-in list

  shutdown:
    graceful_timeout_seconds: 60 # 1..3600  SIGTERM drain budget before forcing bots to leave
    policy: finish_games         # finish_games | leave_now (leave_now forfeits running games)

limits:
  max_actions_per_second_per_bot: 4      # >0..20  token bucket per bot for game commands
  max_reconnect_attempts_per_minute: 6   # 1..120  per-bot reconnect budget

loadtest:                        # development / preprod ONLY (validation error in production)
  enabled: false                 # [restart] must be true for modes: [loadtest]
  allowed_hosts: [localhost, 127.0.0.1]  # [restart] backend hosts that may be load tested ("*.suffix" ok)
  forbidden_hosts: []            # [restart] production hosts; a match always refuses
  target_connections: 100        # 1..max_concurrent_bots  population target
  ramp_per_second: 10            # >0..1000  new bots per second until the target is reached
  duration_seconds: 600          # 1..86400  then bots finish their game and the report is written
  game_mix: {}                   # relative weights; empty = {ludo: 50, ludo_quick: 25, snakes_ladders: 25}
  capacity_mix: {}               # relative weights for 2/3/4 seats; empty = {2: 40, 3: 20, 4: 40}
  think_time_ms: {min: 200, max: 1500}   # replaces profile think time in load tests
  churn_per_minute: 0            # forced disconnect+reconnect events per minute across the population
  slow_reader_fraction: 0.0      # 0..1 share of bots that read slowly (exercises server slow-consumer handling)
  slow_reader_delay_ms: 250      # 0..10000 per-message read delay for slow readers
  malformed_message_rate: 0.0    # 0..0.5 probability per action of also sending a malformed message
  report_path: loadtest-report.json # [restart] JSON report written at the end of the run

metrics:
  enabled: true                  # [restart]
  listen_addr: 127.0.0.1:9091    # [restart] /healthz, /readyz, /metrics (keep internal)
