# Local development: a backend on localhost:8080 (go run ./cmd/server).
# BOT_SERVICE_KEY must match the backend's BOT_SERVICE_KEY_SHA256.
app:
  environment: development
  log_level: debug
  log_format: text

connection:
  backend_http_url: http://localhost:8080/api/v1
  backend_ws_url: ws://localhost:8080/api/v1/ws

bots:
  enabled: true
  modes: [practice, public_fill]
  target_active_bots: 50
  max_concurrent_bots: 100
  public_matchmaking:
    enabled: true
    per_game: {ludo: true, ludo_quick: true, snakes_ladders: true}
    fill_after_seconds: 10
    maximum_wait_seconds: 27
  think_time: {min_ms: 300, max_ms: 4000, randomize: true}
  behavior:
    default_profile: balanced
  chat:
    enabled: true                # quick chat + emotes (defaults: <= 3 per match, >= 8 s apart)
  shutdown:
    graceful_timeout_seconds: 30
    policy: finish_games

loadtest:
  # Load tests use configs/loadtest.example.yaml (modes: [loadtest]).
  enabled: false
  allowed_hosts: [localhost, 127.0.0.1]

metrics:
  enabled: true
  listen_addr: 127.0.0.1:9091
