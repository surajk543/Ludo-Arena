# Production (ludo.sungamestudio.com, deploy/README.md). bot-play runs on the
# same VPS; /etc/hosts maps the name to 127.0.0.1, so bots stay on loopback.
# Load-test mode can never be enabled here (validation error), and the
# backend refuses load-test sessions when APP_ENV=production as well.
app:
  environment: production
  log_level: info
  log_format: json

connection:
  backend_http_url: https://ludo.sungamestudio.com/api/v1
  backend_ws_url: wss://ludo.sungamestudio.com/api/v1/ws

bots:
  enabled: true
  modes: [practice, public_fill] # practice games + Play Online matchmaking assistance
  target_active_bots: 150
  max_concurrent_bots: 300       # production cap is 500
  per_game_max: {ludo: 200, ludo_quick: 100, snakes_ladders: 150}
  max_bots_per_room: 3
  max_room_joins_per_second: 5
  max_connection_attempts_per_second: 10
  public_matchmaking:
    enabled: true                # bots join Play Online lobbies that wait too long
    per_game: {ludo: true, ludo_quick: true, snakes_ladders: true}
    fill_after_seconds: 10       # a human waits this long before bots are asked for
    minimum_humans: 1
    maximum_wait_seconds: 28
    refill_cooldown_seconds: 15
  think_time: {min_ms: 600, max_ms: 6000, randomize: true}
  behavior:
    default_profile: balanced
    disconnect_simulation_enabled: false
  chat:                          # production defaults: on, at most 2 reactions per bot per match
    enabled: true
    max_per_match: 2
    min_interval_ms: 10000
    reaction_delay_ms: {min: 800, max: 3000}
    emote_share: 0.5
    probability: {game_start: 0.05, six: 0.02, capture: 0.12, captured: 0.1, other_capture: 0.02, win: 0.3, loss: 0.15}
  shutdown:
    graceful_timeout_seconds: 300
    policy: finish_games

limits:
  max_actions_per_second_per_bot: 3
  max_reconnect_attempts_per_minute: 6

loadtest:
  enabled: false
  allowed_hosts: [localhost]
  forbidden_hosts: [ludo.sungamestudio.com]

metrics:
  enabled: true
  listen_addr: 127.0.0.1:9091    # host-local scrape only
