# Production. Replace the example host with the real production host.
# Load-test mode can never be enabled here (validation error), and the
# backend refuses load-test sessions when APP_ENV=production as well.
app:
  environment: production
  log_level: info
  log_format: json

connection:
  backend_http_url: https://api.ludoroyale.example/api/v1
  backend_ws_url: wss://api.ludoroyale.example/api/v1/ws

bots:
  enabled: true
  modes: [practice]              # add public_fill to enable matchmaking assistance
  target_active_bots: 150
  max_concurrent_bots: 300       # production cap is 500
  per_game_max: {ludo: 200, ludo_quick: 100, snakes_ladders: 150}
  max_bots_per_room: 3
  max_room_joins_per_second: 5
  max_connection_attempts_per_second: 10
  public_matchmaking:
    enabled: false               # flip to true (and per_game) to start filling public lobbies
    per_game: {ludo: false, ludo_quick: false, snakes_ladders: false}
    fill_after_seconds: 20
    minimum_humans: 1
    maximum_wait_seconds: 28
    refill_cooldown_seconds: 15
  think_time: {min_ms: 600, max_ms: 6000, randomize: true}
  behavior:
    default_profile: balanced
    disconnect_simulation_enabled: false
  shutdown:
    graceful_timeout_seconds: 300
    policy: finish_games

limits:
  max_actions_per_second_per_bot: 3
  max_reconnect_attempts_per_minute: 6

loadtest:
  enabled: false
  allowed_hosts: [localhost]
  forbidden_hosts: [api.ludoroyale.example]

metrics:
  enabled: true
  listen_addr: 0.0.0.0:9091      # cluster-internal scrape only
