name: ludo_royale
description: "Ludo Royale - multiplayer Ludo and Snakes & Ladders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Networking
  dio: ^5.11.1
  web_socket_channel: ^3.0.3

  # Storage: secure for session credentials, prefs for non-sensitive UI settings
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.6
  # App support directory for the profile-picture disk cache (core/assets)
  path_provider: ^2.1.6

  # Identity provider SDKs (credential acquisition only; the Go backend owns sessions)
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  collection: ^1.19.1

  # UI, animation, media
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  # Animated Store profile pictures (Lottie JSON, rendered in pure Dart)
  lottie: ^3.6.1
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

  # Coin packs (consumable in-app purchases, Google Play Billing / StoreKit 2).
  # The Go backend verifies every purchase with the store and grants the
  # coins; the app only buys, forwards the purchase and consumes/finishes it.
  in_app_purchase: ^3.3.1
  # Android-only addition: consume a coin pack after the server granted it.
  in_app_purchase_android: ^0.5.5

  # Product analytics ONLY (no Firebase Auth/Firestore/Remote Config). Gated by core/analytics.
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  config:
    # iOS uses CocoaPods, not Swift Package Manager: with SPM, Xcode resolves
    # every package-level dependency of firebase-ios-sdk 13 (gtm-session-
    # fetcher >= 4) against GoogleSignIn 9 (gtm-session-fetcher 3.3.x) and
    # fails. CocoaPods only resolves the pods actually used (FirebaseAnalytics
    # does not pull GTMSessionFetcher), so the pinned plugin versions build.
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/board/
    - assets/icons/
    - assets/animations/
    # Kenney CC0 sound effects + CC0 lobby music (credits:
    # assets/audio/ASSET_LICENSES.md, not bundled).
    - assets/audio/sfx/
    - assets/audio/music/
    # OFL license texts of the bundled fonts (shown on the licenses page).
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-Baloo2.txt
    - assets/fonts/OFL-BalooBhaijaan2.txt

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    # Script-coverage fallbacks (OFL): Devanagari (hi) and Arabic script (ar, ur)
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooBhaijaan2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
