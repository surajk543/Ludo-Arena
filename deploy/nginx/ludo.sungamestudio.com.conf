# /etc/nginx/sites-available/ludo.sungamestudio.com
# TLS terminates here; the backend listens on 127.0.0.1:8080 only
# (TRUSTED_PROXY_HOPS=1: nginx replaces X-Forwarded-For with the peer address).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream ludo_backend {
    server 127.0.0.1:8080;
    keepalive 128;
}

# Unknown hosts and bare-IP requests get nothing. reuseport lives here (one
# per address:port) and spreads new connections evenly over the workers.
server {
    listen 80 default_server reuseport;
    listen [::]:80 default_server reuseport;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name ludo.sungamestudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ludo.sungamestudio.com;

    ssl_certificate     /etc/letsencrypt/live/ludo.sungamestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ludo.sungamestudio.com/privkey.pem;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;

    # Game WebSocket. The server pings every 20 s and the app every 15 s, so
    # 120 s only closes sockets that are really dead.
    location = /api/v1/ws {
        proxy_pass http://ludo_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Operator API stays on the private network (curl 127.0.0.1:8080 on the host).
    location ^~ /api/v1/admin/ {
        return 404;
    }

    location / {
        proxy_pass http://ludo_backend;
        proxy_set_header Connection "";
        # Bot assignments long-poll for 20 s.
        proxy_read_timeout 60s;
    }
}
