# /etc/nginx/nginx.conf for the Ludo Royale VPS (Ubuntu 24.04).
# Sized for 20k+ concurrent WebSockets: every proxied socket holds two
# connections (client + upstream), so per-worker capacity is
# worker_connections / 2 and the whole server holds
# workers * worker_connections / 2 (8 workers -> ~260k sockets).
user www-data;
worker_processes auto;
worker_rlimit_nofile 262144;
worker_shutdown_timeout 30s;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 65536;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # ~4k sessions per MB: 50 MB covers reconnect storms of 20k clients.
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time $upstream_response_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
