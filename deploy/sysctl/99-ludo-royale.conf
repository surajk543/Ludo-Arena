# /etc/sysctl.d/99-ludo-royale.conf: kernel limits for 20k+ WebSockets.

# File descriptors: one per socket, two per proxied WebSocket in nginx.
fs.file-max = 2097152
fs.nr_open = 2097152

# Accept queues for reconnect storms (all clients reconnect after a deploy).
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Every WebSocket uses one ephemeral port from nginx to 127.0.0.1:8080
# (the default range has ~28k). Keep local service ports out of it.
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.ip_local_reserved_ports = 9090-9100
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Detect dead mobile peers that vanished without a FIN.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# ufw tracks every connection, loopback included (2 entries per WebSocket).
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_tcp_timeout_established = 86400

# Redis background saves (fork) need overcommit.
vm.overcommit_memory = 1
