# /etc/redis/ludo-royale.conf, included at the end of /etc/redis/redis.conf.
# The password lives in /etc/redis/ludo-royale-secret.conf (written by
# provision.sh, never committed).
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 65535

# Live rooms survive a restart: AOF every second + RDB snapshots.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Game state must never be evicted; writes fail loudly instead.
maxmemory-policy noeviction

include /etc/redis/ludo-royale-secret.conf
