# /etc/postgresql/16/main/conf.d/ludo-arena.conf
# PostgreSQL holds wallets, identities and progression only (live games are
# in Redis), so a modest share of RAM is enough. Listens on localhost only.
listen_addresses = 'localhost'
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_compression = on
random_page_cost = 1.1
log_min_duration_statement = 500ms
